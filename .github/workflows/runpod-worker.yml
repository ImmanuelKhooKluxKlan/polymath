name: AI Worker - RunPod Image

on:
  push:
    branches: [main]
    paths:
      - 'serverless/muscriptor/**'
      - 'ml/training/**'
      - 'ml/__init__.py'
      - '.github/workflows/runpod-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-worker-image
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.RUNPOD_IMAGE_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install lightweight worker test dependencies
        run: python -m pip install 'numpy>=2.2,<3' 'mido>=1.3,<2' 'PyYAML>=6,<7'
      - name: Test training and worker timing logic
        run: |
          python -m unittest discover -s ml/training/tests -p 'test_*.py'
          python -m unittest serverless.muscriptor.test_beat_grid
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable RunPod worker
        shell: bash
        run: |
          OWNER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/polymath-muscriptor
          docker buildx build --file serverless/muscriptor/Dockerfile --tag $IMAGE:$GITHUB_SHA --tag $IMAGE:main --push .
          echo Published $IMAGE:$GITHUB_SHA
