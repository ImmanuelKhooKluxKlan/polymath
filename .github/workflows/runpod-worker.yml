name: AI Worker - RunPod Image

on:
  push:
    branches: [main]
    paths:
      - 'serverless/muscriptor/**'
      - 'ml/training/**'
      - 'ml/__init__.py'
      - '.github/workflows/runpod-worker.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: runpod-worker-image
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.RUNPOD_IMAGE_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish immutable RunPod worker
        shell: bash
        run: |
          OWNER=$(echo $GITHUB_REPOSITORY_OWNER | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/polymath-muscriptor
          docker buildx build --file serverless/muscriptor/Dockerfile --tag $IMAGE:$GITHUB_SHA --tag $IMAGE:main --push .
          echo Published $IMAGE:$GITHUB_SHA
