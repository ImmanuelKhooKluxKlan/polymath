name: Backend - AWS ECS

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'scripts/alignment/**'
      - 'Dockerfile.api'
      - '.github/workflows/backend-aws.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-ecs-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci --prefix server
      - run: python -m pip install -r server/omr/requirements.txt
      - run: python -m unittest discover -s server/omr/tests -p 'test_*.py'
      - run: npm test --prefix server

  deploy:
    needs: test
    if: ${{ vars.AWS_ECS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: us-east-2
            cluster: polymath-us
            service: polymath-api-us
            task_family: polymath-api-us
          - region: ap-southeast-1
            cluster: polymath-apac
            service: polymath-api-apac
            task_family: polymath-api-apac
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ matrix.region }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push immutable API image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.AWS_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if aws ecr describe-images \
            --repository-name "$REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            >/dev/null 2>&1; then
            echo "Reusing existing immutable image $REGISTRY/$REPOSITORY:$IMAGE_TAG"
          else
            docker build -f Dockerfile.api -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" .
            docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          fi
          echo IMAGE=$REGISTRY/$REPOSITORY:$IMAGE_TAG >> $GITHUB_ENV
      - name: Register task revision and deploy
        env:
          ECS_CLUSTER: ${{ matrix.cluster }}
          ECS_SERVICE: ${{ matrix.service }}
          TASK_FAMILY: ${{ matrix.task_family }}
          RUNPOD_S3_REPLICAS: ${{ vars.RUNPOD_S3_REPLICAS }}
          RUNPOD_CHAT_BOSS_ENDPOINT_ID: ${{ vars.RUNPOD_CHAT_BOSS_ENDPOINT_ID || 'lk3brapzdbx0ch' }}
          RUNPOD_CHAT_BOSS_MODEL: ${{ vars.RUNPOD_CHAT_BOSS_MODEL || 'polymath-chat-boss' }}
          RUNPOD_CHAT_BOSS_TIMEOUT_MS: ${{ vars.RUNPOD_CHAT_BOSS_TIMEOUT_MS || '900000' }}
          CLIENT_ORIGINS: ${{ vars.CLIENT_ORIGINS || 'https://www.polymathmusician67.com,https://polymath-musician.pages.dev,https://scaling-preview.polymath-musician.pages.dev' }}
          APP_RELEASE: ${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition $TASK_FAMILY --query taskDefinition > current-task.json
          jq \
            --arg image "$IMAGE" \
            --arg runpodReplicas "$RUNPOD_S3_REPLICAS" \
            --arg chatBossEndpointId "$RUNPOD_CHAT_BOSS_ENDPOINT_ID" \
            --arg chatBossModel "$RUNPOD_CHAT_BOSS_MODEL" \
            --arg chatBossTimeoutMs "$RUNPOD_CHAT_BOSS_TIMEOUT_MS" \
            --arg clientOrigins "$CLIENT_ORIGINS" \
            --arg appRelease "$APP_RELEASE" '
            .containerDefinitions[0].image = $image
            | .containerDefinitions[0].environment = (
                (.containerDefinitions[0].environment // [])
                | map(select(.name != "RUNPOD_S3_REPLICAS"
                  and .name != "RUNPOD_CHAT_BOSS_ENDPOINT_ID"
                  and .name != "RUNPOD_CHAT_BOSS_MODEL"
                  and .name != "RUNPOD_CHAT_BOSS_TIMEOUT_MS"
                  and .name != "CLIENT_ORIGINS"
                  and .name != "APP_RELEASE"))
                + [
                    { name: "RUNPOD_S3_REPLICAS", value: $runpodReplicas },
                    { name: "RUNPOD_CHAT_BOSS_ENDPOINT_ID", value: $chatBossEndpointId },
                    { name: "RUNPOD_CHAT_BOSS_MODEL", value: $chatBossModel },
                    { name: "RUNPOD_CHAT_BOSS_TIMEOUT_MS", value: $chatBossTimeoutMs },
                    { name: "CLIENT_ORIGINS", value: $clientOrigins },
                    { name: "APP_RELEASE", value: $appRelease }
                  ]
              )
            | del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)
          ' current-task.json > next-task.json
          TASK_ARN=$(aws ecs register-task-definition --cli-input-json file://next-task.json --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --task-definition $TASK_ARN
          aws ecs wait services-stable --cluster $ECS_CLUSTER --services $ECS_SERVICE
